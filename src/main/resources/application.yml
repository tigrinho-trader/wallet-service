server:
  port: 8082

spring:
  application:
    name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:tigrinho}
    password: ${DB_PASSWORD:tigrinho}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 3 tentativas e depois vai pra wallet.ordem-executada.dlq (sem loop infinito)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3

mensageria:
  exchange: tigrinho.eventos

wallet:
  # Moedas de boas-vindas de cada carteira NOVA (as que ja existem nao mudam). 0 = sem bonus.
  saldo-inicial: ${CARTEIRA_SALDO_INICIAL:0}
  # Cupom de moedas: cada conta resgata uma vez. Codigo vazio ou moedas <= 0 = nenhum cupom vale.
  cupom:
    codigo: ${CUPOM_CODIGO:}
    moedas: ${CUPOM_MOEDAS:0}
  sandbox:
    # false desliga depositos/saques de mentira (antes de plugar o Pix de verdade)
    habilitado: ${WALLET_SANDBOX_HABILITADO:true}
    limite-por-operacao: 5000.00
  binance:
    url: ${BINANCE_URL:https://api.binance.com}
  # Compra de moedas por Pix (AbacatePay). Sem chave = desligado. A chave vem SO do ambiente.
  pix:
    chave-api: ${ABACATEPAY_API_KEY:}
    url: ${ABACATEPAY_URL:https://api.abacatepay.com/v2}
    centavos-por-moeda: ${PIX_CENTAVOS_POR_MOEDA:100}
    expira-em-segundos: 1800
    # Asaas: com chave, substitui o AbacatePay. Sandbox: ASAAS_URL=https://api-sandbox.asaas.com/v3
    asaas:
      chave-api: ${ASAAS_API_KEY:}
      url: ${ASAAS_URL:https://api.asaas.com/v3}
      cliente-id: ${ASAAS_CLIENTE_ID:}
      cliente-cpf-cnpj: ${ASAAS_CLIENTE_CPF_CNPJ:}
  # Repasse automatico Asaas -> Binance -> carteira ponte -> Deriv (conta Options). So liga com todas as
  # chaves no ambiente; REPASSE_DERIV_HABILITADO=false deixa o dinheiro no Asaas.
  repasse:
    habilitado: ${REPASSE_DERIV_HABILITADO:true}
    # 0 = so o saque minimo de USDT da Binance (5 USDT, calculado na hora pela cotacao)
    minimo-reais: ${REPASSE_DERIV_MINIMO_REAIS:0}
    # com repasse em andamento confere a cada 15 s; um Pix confirmado dispara o repasse na hora
    intervalo-ms: ${REPASSE_DERIV_INTERVALO_MS:15000}
    carteira-chave: ${CARTEIRA_PONTE_CHAVE:}
    deriv-endereco: ${DERIV_USDT_BSC_ADDRESS:}
    # token proprio do repasse (precisa da permissao "payment"); vazio = usa DERIV_API_TOKEN/DERIV_APP_ID
    deriv-token: ${REPASSE_DERIV_TOKEN:}
    deriv-app-id: ${REPASSE_DERIV_APP_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
