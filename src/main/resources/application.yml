server:
  port: 8082

spring:
  application:
    name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:tigrinho}
    password: ${DB_PASSWORD:tigrinho}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 3 tentativas e depois vai pra wallet.ordem-executada.dlq (sem loop infinito)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3

mensageria:
  exchange: tigrinho.eventos

wallet:
  saldo-inicial: 1000.00
  sandbox:
    limite-por-operacao: 5000.00

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
